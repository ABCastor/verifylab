# VerifyLab machine configuration: copy to ~/.config/verifylab/machine.toml ($XDG_CONFIG_HOME honoured) and
# uncomment what this computer needs. It belongs to the machine, never to a project: no branch can change it.
# Every path is absolute. A protected check records this file's path and sha256 in its receipt.

[tools]
# Verifier tools. A protected check runs a tool only when a REVISIONS file next to it pins its sha256;
# `vl init --tools --comparator PATH ...` copies tools into ~/.local/share/verifylab/tools/<toolchain>/ and pins them,
# and is used when no key below names the tool.
# comparator = "/opt/verifylab/comparator"
# lean4export = "/opt/verifylab/lean4export"
# landrun = "/opt/verifylab/landrun"
# nanoda = "/opt/verifylab/nanoda_bin"
# Where Lean toolchains are installed (default: the account's ~/.elan); vl never downloads a toolchain.
# elan_home = "/opt/elan"

[caches]
# A project's built Lake directory (its packages/ holds Mathlib), keyed by the path of the project's main checkout.
# Checks mount its packages read-only; lanes see it through a copy-on-write overlay.
# "/srv/research/project" = "/srv/research/project/.lake"

[check]
# Memory cap of all vl runs together on this machine (systemd MemoryMax of the slice vl.slice they share).
# Default: 70% of physical RAM.
# memory_total = "20G"
# Protected Lean checks (ADR 0005) keep Lake's build products of the trusted side (the target and the project modules it imports)
# in ~/.local/share/verifylab/lean-builds/ and reuse them in later checks; false builds them anew every time.
# build_cache = true
# Off by default (ADR 0008): keep what the solution side of a protected check compiled, untrusted, in
# ~/.local/share/verifylab/lean-solution-builds/, under the digest of every input of that build, and mount it read-only
# in a later check of exactly the same inputs. The kernels still replay it; the receipt names the entry.
# Audit projects (many challenges, one workspace) set it to true.
# reuse_solution_builds = false

[sandbox]
# What this computer is (ADR 0012, proposed). "workstation" (default): a package of lake-manifest.json outside the
# trusted ref's [lean] trusted_packages (default: Mathlib and its official dependencies) makes `vl check`,
# `vl lane new` and `vl import` unsupported. "disposable" lets them run, and receipts record the class: say it only
# in a purpose-built VM, fresh for each batch, with no credentials but a write-only results channel, destroyed afterwards.
# class = "workstation"

[machine]
# Who this computer is, for receipts that travel between your machines (ADR 0015, proposed). The name is recorded in
# every receipt this machine writes and in the bundle of `vl receipts export`; `trust` says how other machines class
# these receipts: "own" (default) lets an integrator import them as counted-once-admitted, "foreign" only as
# quarantined until `vl replay` reproduces them.
# name = "worker-a"
# trust = "own"

[queue]
# The job queue of every heavy run on this machine: `vl check`, `vl lane exec` and `vl queue run -- CMD` start only
# when a slot is free, their reservations fit memory_total, and MemAvailable stays above keep_free; else they wait.
# A check reserves the largest memory peak of the item's 5 newest admitted or exploratory receipts; a first check
# the largest of its checker's receipts in the repository, else default_reservation.
# threads = 4                    # CPUs one check may use: Lean's and Lake's worker threads (LEAN_NUM_THREADS) and
#                                # the CPU quota of the check's slice; default 4, at most the number of CPUs
# slots = 3                      # jobs at once; default: the number of CPUs divided by threads
# keep_free = "3G"               # memory the queue never plans to use; default 3G
# default_reservation = "2G"     # default 2G
# max_wait = 3600                # seconds a job waits before it gives up (exit 2); default: no limit
# `vl queue status --explain` prints each of these and whether this file, a flag or the default set it.

[launchers]
# System programs vl starts, by absolute path: bwrap, systemd-run, systemctl, env, stdbuf, sh, git. Default: the
# first of /usr/bin, /bin, /usr/sbin, /sbin that has it; never the caller's PATH. Programs started inside the jail
# (env, stdbuf, sh, git) must live under a folder the jail mounts (/usr, /bin, ...).
# bwrap = "/usr/bin/bwrap"
