[project]
name = "verifylab"
version = "0.1.0"
description = "Minimal research toolkit for LLM agents: trusted targets, receipts, reviews, lanes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "fixtures/comparator-known/LICENSE", "fixtures/comparator-known/NOTICE"]
authors = [{ name = "Edoardo Avenia" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vl = "verifylab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verifylab"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "verifylab/templates"
"skills" = "verifylab/skills"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lean: needs the Lean toolchain and Comparator (slow)",
    "jail: needs bubblewrap",
]
